<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sophia 的廚房</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: grid-paper journal; sticky tab bar of category stickers; cards taped onto the page like photos in a planner */
:root{
  --paper:#fffaf6; --grid:#f3e6ea; --ink:#4a3a40; --soft:#8a7479;
  --card:#ffffff; --line:#eedde2;
  --pink:#f6a6b8; --pink-bg:#fde7ec;
  --mint:#8fd1bd; --mint-bg:#e2f5ef;
  --butter:#f7cf6b; --butter-bg:#fdf3d6;
  --sky:#9cc6ee; --sky-bg:#e5f0fb;
  --lilac:#c3aee8; --lilac-bg:#efe8fb;
  --peach:#f6b48f; --peach-bg:#fdeadf;
  --tape:rgba(246,166,184,.55); --cta:#d9577a; --cta-deep:#a83a58;
  --shadow:0 2px 0 rgba(74,58,64,.06),0 8px 22px -12px rgba(74,58,64,.25);
  --f-display:"Huninn","jf-openhuninn","Noto Sans TC","PingFang TC",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#241d21; --grid:#2f262b; --ink:#f5e9ec; --soft:#bba7ad; --card:#30272c; --line:#43373d;
  --pink-bg:#4a2c35; --mint-bg:#20403a; --butter-bg:#463a1e; --sky-bg:#233649; --lilac-bg:#352c4a; --peach-bg:#4a3125;
  --tape:rgba(246,166,184,.35); --cta:#d9577a; --cta-deep:#8f3049; --shadow:0 8px 22px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#241d21; --grid:#2f262b; --ink:#f5e9ec; --soft:#bba7ad; --card:#30272c; --line:#43373d;
  --pink-bg:#4a2c35; --mint-bg:#20403a; --butter-bg:#463a1e; --sky-bg:#233649; --lilac-bg:#352c4a; --peach-bg:#4a3125;
  --tape:rgba(246,166,184,.35); --cta:#d9577a; --cta-deep:#8f3049; --shadow:0 8px 22px -12px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.hero{padding-block:40px 18px;display:grid;gap:18px}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,7vw,56px);line-height:1.1;margin:0;text-wrap:balance}
.hero h1 .hl{background:linear-gradient(transparent 58%,var(--butter) 58%);padding:0 .1em}
.hero p{margin:0;color:var(--soft);max-width:36em}
.stats{display:flex;flex-wrap:wrap;gap:10px}
.stat{background:var(--card);border:2px dashed var(--line);border-radius:16px;padding:8px 16px;display:flex;align-items:baseline;gap:6px}
.stat b{font-family:var(--f-display);font-weight:400;font-size:26px;font-variant-numeric:tabular-nums}
.stat span{color:var(--soft);font-size:13px}

nav.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(6px);border-bottom:2px dotted var(--line)}
nav.bar .wrap{padding-block:10px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{flex:1 1 220px;min-width:0;position:relative}
.search input{width:100%;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:999px;padding:8px 16px 8px 38px;outline:none}
.search input:focus{border-color:var(--pink)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--soft)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.seg.mode button{font-size:13px;padding:5px 12px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:-4px}
.tag{font-size:11px;color:var(--soft);border:1.5px solid var(--line);border-radius:999px;padding:0 8px;font-variant-numeric:tabular-nums}
.tag.kc{border-color:transparent;background:var(--butter-bg);color:var(--ink)}
.chip{font:inherit;font-size:13px;color:var(--ink);border:0;border-radius:999px;padding:6px 12px;cursor:pointer;background:var(--c-bg);white-space:nowrap}
.chip small{color:var(--soft);margin-left:3px;font-variant-numeric:tabular-nums}
.chip:hover,.chip:focus-visible{outline:2px solid var(--c);outline-offset:1px}

main{padding-block:10px 60px}
section.cat{scroll-margin-top:120px;padding-top:26px}
.cat-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.cat-head h2{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0;background:var(--c-bg);padding:2px 16px;border-radius:10px 4px 10px 4px;transform:rotate(-1deg)}
.cat-head .n{color:var(--soft);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:26px 20px}

.card{position:relative;background:var(--card);border-radius:6px;padding:10px 10px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-width:0}
.card:nth-child(3n+1){transform:rotate(-.6deg)} .card:nth-child(3n+2){transform:rotate(.5deg)}
.card::before{content:"";position:absolute;top:-9px;left:50%;width:78px;height:20px;margin-left:-39px;background:var(--tape);transform:rotate(-3deg);border-radius:2px}
.card:nth-child(even)::before{background:color-mix(in srgb,var(--c) 55%,transparent);transform:rotate(4deg)}
.photo{position:relative;border:0;padding:0;cursor:zoom-in;border-radius:4px;overflow:hidden;aspect-ratio:4/3;background:var(--grid);display:block;width:100%}
.photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.photo:hover img{transform:scale(1.04)}
.photo:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.count{position:absolute;right:8px;bottom:8px;background:rgba(255,255,255,.9);color:#4a3a40;font-size:12px;border-radius:999px;padding:1px 9px}
.card h3{font-family:var(--f-display);font-weight:400;font-size:20px;margin:0;line-height:1.3}
.card p{margin:0;font-size:14px;color:var(--soft)}
.ing{display:flex;flex-wrap:wrap;gap:5px}
.ing span{font-size:12px;background:var(--c-bg);border-radius:6px;padding:1px 8px}
.meta{font-size:12px;color:var(--soft);border-top:1.5px dashed var(--line);padding-top:8px;display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.meta b{color:var(--ink);font-weight:500}
.empty{text-align:center;color:var(--soft);padding:60px 0;font-family:var(--f-display);font-size:20px}

/* lightbox */
.lb{position:fixed;inset:0;z-index:20;background:rgba(36,29,33,.82);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb-box{background:var(--card);border-radius:14px;padding:12px;max-width:min(980px,100%);max-height:100%;display:flex;flex-direction:column;gap:10px;min-width:0}
.lb-img{position:relative;min-height:0;flex:1;display:flex;align-items:center;justify-content:center}
.lb-img img{height:min(68vh,75vw);width:auto;max-width:100%;object-fit:contain;border-radius:8px;display:block;transition:filter .25s}
.lb-img img.soft{filter:blur(6px)}
.lb-cap{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.lb-cap h4{margin:0;font-family:var(--f-display);font-weight:400;font-size:20px}
.lb-cap span{color:var(--soft);font-size:13px;font-variant-numeric:tabular-nums}
.lb-thumbs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.lb-thumbs button{flex:0 0 auto;border:2px solid transparent;border-radius:6px;padding:0;cursor:pointer;background:none;opacity:.6}
.lb-thumbs button[aria-current="true"]{border-color:var(--pink);opacity:1}
.lb-thumbs img{width:64px;height:48px;object-fit:cover;display:block;border-radius:4px}
.nav-btn,.close{border:0;cursor:pointer;background:var(--card);color:var(--ink);width:40px;height:40px;border-radius:50%;font-size:22px;line-height:1;box-shadow:var(--shadow)}
.nav-btn{position:absolute;top:50%;transform:translateY(-50%)}
.prev{left:6px}.next{right:6px}
.close{flex:0 0 auto}
.nav-btn:focus-visible,.close:focus-visible{outline:3px solid var(--pink)}
footer{color:var(--soft);font-size:13px;text-align:center;padding-block:0 40px}
@media (max-width:520px){.grid{grid-template-columns:1fr 1fr;gap:20px 12px}.card h3{font-size:17px}.card p{display:none}.ing{display:none}.meta{flex-direction:column;gap:0}}
@media (prefers-reduced-motion:reduce){.photo img{transition:none}.card{transform:none!important}}

/* view tabs */
.tabs{display:flex;gap:8px;padding-block:4px 14px}
.tab{font:inherit;font-family:var(--f-display);font-size:18px;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px 14px 4px 14px;padding:8px 20px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--butter-bg);border-color:var(--butter);transform:rotate(-1.5deg)}
.tab:focus-visible{outline:3px solid var(--pink);outline-offset:2px}

/* weekly menu */
.menu{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:24px;align-items:start;padding-block:8px 60px}
@media (max-width:880px){.menu{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--card);border-radius:10px;padding:18px;box-shadow:var(--shadow);min-width:0}
.ph{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0 0 12px}
.field{display:grid;gap:8px;margin-bottom:14px}
.lbl{font-weight:500;font-size:14px}
.hint{color:var(--soft);font-size:13px;font-weight:400}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.have button{font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:5px 13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--pink-bg);border-color:var(--pink);font-weight:500}
.have button[aria-pressed="true"]{background:var(--mint-bg);border-color:var(--mint);font-weight:500}
.seg button:focus-visible,.have button:focus-visible,.btn:focus-visible,.ops button:focus-visible,.thumb:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
details.field summary{cursor:pointer;list-style:none;display:flex;gap:6px;align-items:baseline}
details.field summary::-webkit-details-marker{display:none}
details.field summary::before{content:"▸";color:var(--soft);transition:transform .2s}
details.field[open] summary::before{transform:rotate(90deg)}
.have{display:grid;gap:10px;margin-top:6px}
.have h5{margin:0 0 4px;font-size:12px;color:var(--soft);font-weight:500;letter-spacing:.05em}
.have div{display:flex;flex-wrap:wrap;gap:5px}
.have button{font-size:13px;padding:3px 10px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:8px 18px;cursor:pointer}
.btn.primary{background:var(--cta);border-color:var(--cta);color:#fff;font-family:var(--f-display);font-size:20px;padding:12px 30px;display:inline-flex;align-items:center;gap:10px;
  box-shadow:0 4px 0 var(--cta-deep),0 10px 20px -8px var(--cta);transition:transform .15s,box-shadow .15s}
.btn.primary svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.primary:hover{border-color:var(--cta);transform:translateY(-2px);box-shadow:0 6px 0 var(--cta-deep),0 14px 24px -8px var(--cta)}
.btn.primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--cta-deep)}
.plan-actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:6px;padding-top:16px;border-top:2px dashed var(--line)}
@media (max-width:520px){.btn.primary{flex:1 1 100%;justify-content:center}}
@media (prefers-reduced-motion:reduce){.btn.primary{transition:none}.btn.primary:hover,.btn.primary:active{transform:none}}
.btn:hover{border-color:var(--pink)}
.btn.small{font-size:13px;padding:4px 14px;margin-top:10px}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px 16px;margin-top:22px}
.day{background:var(--card);border-radius:10px;padding:14px;box-shadow:var(--shadow);min-width:0;position:relative}
.day::before{content:"";position:absolute;top:-8px;left:18px;width:60px;height:18px;background:var(--tape);transform:rotate(-4deg);border-radius:2px}
.day h3{font-family:var(--f-display);font-weight:400;font-size:19px;margin:0 0 8px}
.day ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.dish-row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center}
.thumb{border:0;padding:0;border-radius:6px;overflow:hidden;width:52px;height:40px;cursor:zoom-in;background:var(--grid)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.dn{min-width:0;display:grid;line-height:1.35}
.dn b{font-weight:500;font-size:15px}
.slot{font-size:11px;color:var(--soft)}
.dn small{font-size:11px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dn small em{font-style:normal;background:var(--mint-bg);border-radius:4px;padding:0 4px;color:var(--ink)}
.ops{display:flex;gap:2px}
.ops button{border:0;background:none;color:var(--soft);width:34px;height:34px;border-radius:8px;cursor:pointer;display:grid;place-items:center}
.ops button:hover{background:var(--grid);color:var(--ink)}
.ops button[aria-pressed="true"]{color:var(--ink);background:var(--pink-bg)}
.ops svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.shop{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);max-height:calc(100vh - 32px);overflow:auto}
@media (max-width:880px){.shop{position:static;max-height:none;overflow:visible}}
.shop .grp{margin-top:12px}
.shop h4{margin:0 0 6px;font-size:13px;color:var(--soft);font-weight:500;letter-spacing:.05em;border-bottom:1.5px dashed var(--line);padding-bottom:4px}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;padding:4px 0;font-size:15px}
.item input[type=checkbox]{accent-color:var(--pink);width:17px;height:17px;margin:0}
.item label{display:grid;line-height:1.3;cursor:pointer;min-width:0}
.item label small{color:var(--soft);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.done label span{text-decoration:line-through;color:var(--soft)}
.qty{font-weight:700;color:var(--cta);font-size:13px}
.price{display:flex;align-items:baseline;gap:1px;font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums}
.price input{width:52px;font:inherit;font-size:14px;color:var(--ink);background:transparent;border:0;border-bottom:1.5px dashed var(--line);text-align:right;padding:1px 2px;-moz-appearance:textfield}
.price input::-webkit-inner-spin-button,.price input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.price input:focus{outline:none;border-bottom-color:var(--pink);background:var(--pink-bg)}
.price.edited input{color:var(--cta);font-weight:700}
.price small{font-size:11px;max-width:48px;overflow:hidden;white-space:nowrap}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:18px}
@media (max-width:760px){.sum{grid-template-columns:minmax(0,1fr)}}
.sum section{min-width:0}
.sh{font-family:var(--f-display);font-weight:400;font-size:18px;margin:0 0 8px}
.big{font-family:var(--f-display);font-size:34px;line-height:1.1;margin-bottom:6px;font-variant-numeric:tabular-nums}
.sum .hint{margin:4px 0 0;font-size:12px}
.pbars{display:grid;gap:5px;margin-bottom:10px}
.pbar{display:grid;grid-template-columns:44px minmax(0,1fr) 18px;align-items:center;gap:8px;font-size:13px}
.pbar i{display:block;height:9px;background:var(--grid);border-radius:999px;overflow:hidden}
.pbar b{display:block;height:100%;background:var(--pink);border-radius:999px;min-width:0}
.pbar em{font-style:normal;color:var(--soft);text-align:right;font-variant-numeric:tabular-nums}
.tips{list-style:none;margin:0;padding:0;display:grid;gap:5px;font-size:13px}
.tips li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:6px;align-items:start}
.tips li::before{content:"";width:16px;height:16px;border-radius:50%;margin-top:2px;background:var(--mint-bg);border:2px solid var(--mint)}
.tips li.warn::before{background:var(--butter-bg);border-color:var(--butter)}
.kcal{list-style:none;margin:0;padding:0;display:grid;gap:3px;font-size:14px}
.kcal li{display:flex;justify-content:space-between;border-bottom:1.5px dotted var(--line);padding:2px 0;font-variant-numeric:tabular-nums}
.kcal b{font-weight:500}
.chiplist{display:flex;flex-wrap:wrap;gap:5px}
.chiplist span{font-size:12px;background:var(--grid);border-radius:6px;padding:1px 8px}
.shop .actions{margin-top:16px;align-items:center}
.copymsg{font-size:13px;color:var(--soft)}
.copybox{width:100%;min-height:140px;margin-top:10px;font:inherit;font-size:13px;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:8px}
.empty-plan{color:var(--soft);margin-top:20px}
/* 加入菜單的小按鈕 */
.add-fab{position:absolute;top:18px;right:18px;z-index:2;width:36px;height:36px;border-radius:50%;border:0;background:var(--cta);color:#fff;font-size:24px;line-height:1;cursor:pointer;box-shadow:0 3px 0 var(--cta-deep);display:grid;place-items:center}
.add-fab:hover{transform:translateY(-1px)}
.add-fab:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
/* 共用對話框 */
.dlg{position:fixed;inset:0;z-index:30;background:rgba(36,29,33,.55);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dlg-box{background:var(--card);border-radius:14px;padding:16px;width:min(560px,100%);max-height:100%;display:flex;flex-direction:column;gap:12px;min-width:0}
.dlg-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dlg-head h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:20px}
.dlg-body{overflow:auto;min-height:0;display:grid;gap:10px}
.daypick{display:grid;gap:8px}
.daypick button{font:inherit;text-align:left;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;display:grid;gap:2px}
.daypick button:hover,.daypick button:focus-visible{border-color:var(--pink);outline:none}
.daypick b{font-family:var(--f-display);font-weight:400;font-size:17px}
.daypick small{color:var(--soft);font-size:12px}
.picksearch{font:inherit;width:100%;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:8px 14px}
.picklist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.picklist button{font:inherit;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:6px;cursor:pointer;display:grid;gap:4px;text-align:left}
.picklist button:hover,.picklist button:focus-visible{border-color:var(--pink);outline:none}
.picklist img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;display:block}
.picklist span{font-size:14px;line-height:1.3}
.picklist small{font-size:11px;color:var(--soft)}
.qr{display:grid;place-items:center;padding:8px;background:#fff;border-radius:10px;justify-self:center}
.qr img,.qr canvas{display:block;width:200px;height:200px}
.sharelink{width:100%;font:inherit;font-size:12px;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:8px}
/* 提示訊息 */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
/* 分享來的菜單 */
.incoming{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--butter-bg);border:2px dashed var(--butter);border-radius:10px;padding:12px 14px;margin-bottom:16px}
.incoming p{margin:0;flex:1 1 220px}

.day-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.day-head h3{margin:0}
.cooked{font:inherit;font-size:12px;color:var(--soft);background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer;white-space:nowrap}
.cooked[aria-pressed="true"]{background:var(--mint-bg);border-color:var(--mint);color:var(--ink);font-weight:700}
.cooked:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.day.done{opacity:.75}

.longago{display:flex;flex-wrap:wrap;gap:6px}
.longago button{font:inherit;font-size:13px;color:var(--ink);background:var(--paper);border:2px dashed var(--line);border-radius:999px;padding:4px 12px;cursor:pointer}
.longago button:hover,.longago button:focus-visible{border-color:var(--cta);outline:none}
.longago small{color:var(--soft);margin-left:4px}

.shopmode{position:fixed;inset:0;z-index:35;background:var(--paper);overflow:auto;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

function render(q=""){
  q=q.trim().toLowerCase();
  const nameOf=(arr,k)=>arr.find(x=>x.k===k).name;
  const match=d=>!q||d.n.toLowerCase().includes(q)||d.i.some(x=>x.toLowerCase().includes(q))||d.d.includes(q)||nameOf(CUISINES,cuisineOf(d)).includes(q);
  const groups=groupBy==="cuisine"?CUISINES:CATS, keyOf=groupBy==="cuisine"?cuisineOf:d=>d.c;
  // 卡片上標示另一種分類
  const tagOf=groupBy==="cuisine"?d=>nameOf(CATS,d.c):d=>nameOf(CUISINES,cuisineOf(d));
  let html="",any=false;
  $("#chips").innerHTML="";
  for(const cat of groups){
    const list=DISHES.filter(d=>keyOf(d)===cat.k&&match(d)).sort((a,b)=>b.p.length-a.p.length);
    const chip=document.createElement("button");
    chip.className="chip";chip.style.setProperty("--c",cat.c);chip.style.setProperty("--c-bg",cat.bg);
    chip.innerHTML=`${cat.name}<small>${list.length}</small>`;
    chip.disabled=!list.length;chip.style.opacity=list.length?1:.45;
    chip.onclick=()=>document.getElementById("cat-"+cat.k).scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
    $("#chips").append(chip);
    if(!list.length)continue;
    any=true;
    html+=`<section class="cat" id="cat-${cat.k}" style="--c:${cat.c};--c-bg:${cat.bg}">
      <div class="cat-head"><h2>${cat.name}</h2><span class="n">${list.length} 道</span></div><div class="grid">`+
      list.map(d=>{
        const ds=sorted(d.p),idx=DISHES.indexOf(d);
        const last=lastMade(d);
        return `<article class="card">
          <button class="add-fab" data-add="${idx}" aria-label="把 ${d.n} 加入本週菜單" title="加入本週菜單">+</button>
          <button class="photo" data-i="${idx}" aria-label="看 ${d.n} 的照片">
            <img src="${cover(d)}" alt="${d.n}" loading="lazy">
            ${d.p.length>1?`<span class="count">${d.p.length} 張</span>`:""}
          </button>
          <div class="tags"><span class="tag">${tagOf(d)}</span><span class="tag kc">約 ${KCAL[d.n]||200} kcal</span></div>
          <h3>${d.n}</h3><p>${d.d}</p>
          <div class="ing">${d.i.map(x=>`<span>${x}</span>`).join("")}</div>
          <div class="meta"><span title="第一次 ${ds[0]}">最近 <b>${last}</b></span><span>做過 <b>${timesMade(d)}</b> 次</span></div>
        </article>`}).join("")+`</div></section>`;
  }
  $("#main").innerHTML=any?html:`<div class="empty">找不到「${q.replace(/[<>&"]/g,"")}」，換個關鍵字試試看</div>`;
}

// lightbox
let cur=null,pos=0,lastFocus=null;
const loaded=new Set();
function preload(id){if(loaded.has(id))return;loaded.add(id);new Image().src=full(id)}
function show(){
  const id=cur.p[pos],img=$("#lbImg");
  // show an already-cached preview at once (the card photo for the cover, the strip's tiny one otherwise),
  // then swap in the sharp photo when it arrives
  img.alt=cur.n;
  const hi=new Image();
  hi.src=full(id);loaded.add(id);
  if(hi.complete&&hi.naturalWidth){img.src=hi.src;img.classList.remove("soft")}
  else{
    img.src=mini(id);img.classList.add("soft");
    hi.onload=()=>{if(cur&&cur.p[pos]===id){img.src=hi.src;img.classList.remove("soft")}};
  }
  if(cur.p.length>1){preload(cur.p[(pos+1)%cur.p.length]);preload(cur.p[(pos-1+cur.p.length)%cur.p.length])}
  $("#lbTitle").textContent=cur.n;
  $("#lbDate").textContent=`${dateOf(id)}　${pos+1} / ${cur.p.length}`;
  $("#lbPrev").hidden=$("#lbNext").hidden=cur.p.length<2;
  [...$("#lbThumbs").children].forEach((b,i)=>b.setAttribute("aria-current",i===pos));
}
function open(d){
  cur=d;pos=0;lastFocus=document.activeElement;
  $("#lbThumbs").innerHTML=d.p.length>1?d.p.map((id,i)=>`<button data-k="${i}" aria-label="第 ${i+1} 張"><img src="${mini(id)}" alt="" width="64" height="48"></button>`).join(""):"";
  $("#lb").hidden=false;show();$("#lbClose").focus();
}
function close(){$("#lb").hidden=true;lastFocus&&lastFocus.focus()}
const step=n=>{pos=(pos+n+cur.p.length)%cur.p.length;show()};

$("#main").addEventListener("click",e=>{
  const a=e.target.closest(".add-fab");if(a){addToPlan(DISHES[+a.dataset.add]);return}
  const b=e.target.closest(".photo");if(b)open(DISHES[+b.dataset.i]);
});
// start fetching the big photo as soon as a card is pointed at, pressed or focused
for(const ev of ["pointerover","pointerdown","focusin"])
  $("#main").addEventListener(ev,e=>{const b=e.target.closest(".photo");if(b)preload(DISHES[+b.dataset.i].p[0])},{passive:true});
$("#lbThumbs").addEventListener("click",e=>{const b=e.target.closest("button");if(b){pos=+b.dataset.k;show()}});
$("#lbPrev").onclick=()=>step(-1);$("#lbNext").onclick=()=>step(1);$("#lbClose").onclick=close;
$("#lb").addEventListener("click",e=>{if(e.target.id==="lb")close()});
document.addEventListener("keydown",e=>{if($("#lb").hidden)return;if(e.key==="Escape")close();if(e.key==="ArrowLeft")step(-1);if(e.key==="ArrowRight")step(1)});
$("#q").addEventListener("input",e=>render(e.target.value));
function setGroup(g){
  groupBy=g;
  [...$("#groupSel").children].forEach(b=>b.setAttribute("aria-pressed",b.dataset.g===g));
  try{localStorage.setItem("kitchen-group",g)}catch(e){}
  render($("#q").value);
}
$("#groupSel").addEventListener("click",e=>{const b=e.target.closest("button");if(b)setGroup(b.dataset.g)});

  "小白菜豬肉湯麵":500,"番茄蔬菜泡麵":500
};
Object.assign(KCAL,{"水煮花椰菜":60,"雞蛋豆腐煎蛋":220,"絲瓜蛤蜊蛋花湯":150,"毛豆胡麻豆腐":200,"小白菜炒玉米筍":70,"水煮四季豆":50,"炒大陸妹":70,"鯛魚蔬菜湯":180,"高麗菜雞湯":230,"蔬菜肉片湯":200,"味噌雞腿":380,"絲瓜玉米湯":120,"蔥蛋":180});
const RICE_KCAL=280;
// 已含飯或麵、不用另外配白飯的菜
const HAS_CARB=new Set(["雞肉優格咖哩飯","親子丼","牛丼","香菇豬肉鹹粥","雞胸肉健康餐盒","鮮蝦義大利麵","鮭魚奶油義大利麵","奶油蔬菜義大利麵",
  "茄汁櫛瓜義大利麵","肉醬義大利麵","番茄牛肉麵","牛肉湯麵","小白菜豬肉湯麵","番茄蔬菜泡麵"]);
const PROTEINS=[
  {k:"chicken",name:"雞",re:/雞(?!蛋)/},{k:"pork",name:"豬",re:/豬|排骨|絞肉|貢丸|^肉片$|^肉絲$/},{k:"beef",name:"牛",re:/牛(?!蒡)/},
  {k:"sea",name:"海鮮",re:/魚|蝦|蛤蜊|竹輪/},{k:"soy",name:"蛋・豆",re:/蛋|豆腐|豆干|豆乳/}
];
const priceOf=x=>{const o=M.prices&&M.prices[x];return Number.isFinite(o)?o:(PRICE[x]?PRICE[x][0]:40)};
const unitOf=x=>PRICE[x]?PRICE[x][1]:"份";
// 一份大約夠煮幾道菜（兩人份），沒列的算 1 道
const USES={"蛋":3,"紅蘿蔔":3,"白菜":2,"香菇":2,"番茄":2,"洋蔥":2,"高麗菜":2,"玉米":2,"櫛瓜":2,"玉米筍":2,"杏鮑菇":2,"麵條":2,
  "義大利麵":3,"木耳":3,"竹輪":2,"白蘿蔔":2,"豆干":2,"寬麵":3,"油豆腐":2,"鮮奶油":2,"海帶芽":6,"貢丸":2,"優格":2,"牛蒡":2,"泡菜":3,
  "青椒":2,"檸檬":3,"魚板":2,"九層塔":2,"豆乳":2,"生菜":2,"鹹蛋黃":2,"皮蛋":2,"芹菜":2};
const usesOf=x=>USES[x]||1;
// 要付的錢＝買幾份 × 價格；用掉的價值＝實際用到的比例
function costOf(need){
  let pay=0,used=0;const packs=new Map();
  for(const [x,ds] of need){const k=Math.ceil(ds.length/usesOf(x));packs.set(x,k);pay+=k*priceOf(x);used+=ds.length/usesOf(x)*priceOf(x)}
  return {pay,used,packs};
}
const proteinsOf=d=>PROTEINS.filter(p=>d.i.some(x=>p.re.test(x))).map(p=>p.k);
const ICON={
  swap:'<svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 14-5.3L20 9"/><path d="M20 4v5h-5"/><path d="M20 12a8 8 0 0 1-14 5.3L4 15"/><path d="M4 20v-5h5"/></svg>',
  list:'<svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>',
  lock:'<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>'
};

let M={days:[0,1,2,3,4],meal:"2+1",have:[],plan:null,checked:[],prices:{},cooked:{}};
try{const s=JSON.parse(localStorage.getItem("kitchen-menu-v1")||"null");if(s&&Array.isArray(s.days))M={...M,...s}}catch(e){}
const saveM=()=>{try{localStorage.setItem("kitchen-menu-v1",JSON.stringify(M))}catch(e){}};
const haveSet=()=>new Set(M.have);
const mealOf=k=>MEALS.find(m=>m.k===k)||MEALS[2];

function proteinTag(d){
  for(const [k,t] of [["鮭","鮭魚"],["蝦","蝦"],["蛤","蛤蜊"],["魚","魚"],["雞","雞"],["牛","牛"],["排骨","豬"],["豬","豬"],["肉","豬"]])
    if(d.n.includes(k)||d.i.some(x=>x.includes(k)))return t;
  return d.n;
}
// 這週已排進去的菜的狀況：用過的食材、各種蛋白質出現幾次、吃過哪些蔬菜
function planCtx(names){
  const ingr=new Set(),prot={},veg=new Set();
  for(const n of names){const d=byName.get(n);if(!d)continue;
    d.i.forEach(x=>{ingr.add(x);if(groupOf(x)==="veg")veg.add(x)});
    proteinsOf(d).forEach(p=>prot[p]=(prot[p]||0)+1);
  }
  return {ingr,prot,veg};
}
function weight(d,slot,have,ctx){
  let w=1+Math.min(d.p.length,8)*0.25;             // 常做的菜比較容易被選到
  const m=d.i.filter(x=>have.has(x)).length;
  if(have.size)w*=m?1+3*m:0.3;                       // 用得到冰箱食材的優先
  if(slot==="main"&&d.c==="main")w*=0.5;             // 飯麵類偶爾當主菜
  const since=daysSince(lastMade(d));
  if(since<7)w*=0.15; else if(since>120)w*=1.6;      // 這週剛煮過的少排，好久沒做的多排
  // 省錢：要另外買的食材越貴越少選；跟這週其他菜共用食材的加分
  const extra=d.i.filter(x=>!STAPLES.has(x)&&!have.has(x)&&!ctx.ingr.has(x)).reduce((a,x)=>a+priceOf(x)/usesOf(x),0);
  w*=1/(1+extra/300);
  // 均衡：同一種蛋白質這週出現越多次越少選；帶來新蔬菜的加分
  const ps=proteinsOf(d);
  if(ps.length)w*=1/(1+0.7*Math.max(...ps.map(p=>ctx.prot[p]||0)));
  const newVeg=d.i.filter(x=>groupOf(x)==="veg"&&!STAPLES.has(x)&&!ctx.veg.has(x)).length;
  w*=1+0.3*newVeg;
  return w;
}
function pick(slot,used,avoidTag){
  const have=haveSet(),ctx=planCtx(used);
  const fits=d=>SLOT[slot].ok?SLOT[slot].ok(d):SLOT[slot].cats.includes(d.c);
  let pool=DISHES.filter(d=>fits(d)&&!used.has(d.n));
  if(!pool.length)pool=DISHES.filter(fits);
  const noRepeat=pool.filter(d=>proteinTag(d)!==avoidTag);
  if((slot==="main"||slot==="pot")&&avoidTag&&noRepeat.length)pool=noRepeat;
  const ws=pool.map(d=>weight(d,slot,have,ctx));
  let r=Math.random()*ws.reduce((a,b)=>a+b,0);
  for(let i=0;i<pool.length;i++){r-=ws[i];if(r<=0)return pool[i]}
  return pool.at(-1);
}
function makePlan(){
  const slots=mealOf(M.meal).slots, old=M.plan||{}, used=new Set(), plan={};
  // 先保留鎖住的菜
  for(const day of M.days){
    const prev=old[day]||[];
    if(M.cooked&&M.cooked[day]&&prev.length){plan[day]=prev.map(r=>({...r}));prev.forEach(r=>used.add(r.n));continue}
    plan[day]=slots.map(slot=>{
      const keep=prev.find(x=>x.lock&&x.slot===slot&&!x._taken&&byName.has(x.n));
      if(keep){keep._taken=true;used.add(keep.n);return {slot,n:keep.n,lock:true}}
      return {slot,n:null,lock:false};
    });
  }
  let lastTag=null;
  for(const day of [...M.days].sort((a,b)=>a-b)){
    for(const row of plan[day]){
      if(!row.n){const d=pick(row.slot,used,row.slot==="main"||row.slot==="pot"?lastTag:null);row.n=d.n;used.add(d.n)}
    }
    const main=plan[day].find(r=>r.slot==="main"||r.slot==="pot");
    lastTag=main?proteinTag(byName.get(main.n)):null;
  }
  M.plan=plan;saveM();renderPlan();
}
function swapDish(day,i){
  const row=M.plan[day][i];
  const used=new Set(Object.values(M.plan).flat().filter(r=>r!==row).map(r=>r.n));
  used.add(row.n);
  const d=pick(row.slot,used,null);
  row.n=d.n;row.lock=false;saveM();renderPlan();
}

// 加一天：只排那一天，其他天不動
function addDay(day){
  if(!M.plan){makePlan();return}
  const used=new Set(Object.values(M.plan).flat().map(r=>r.n));
  const before=Object.keys(M.plan).map(Number).filter(d=>d<day).sort((a,b)=>a-b);
  const prev=before.length?M.plan[before.at(-1)].find(r=>r.slot==="main"||r.slot==="pot"):null;
  const lastTag=prev&&byName.get(prev.n)?proteinTag(byName.get(prev.n)):null;
  M.plan[day]=mealOf(M.meal).slots.map(slot=>{
    const d=pick(slot,used,slot==="main"||slot==="pot"?lastTag:null);used.add(d.n);return {slot,n:d.n,lock:false};
  });
}
// 讓菜單的天數跟設定一致
function syncDays(){
  if(!M.plan)return;
  // 菜改名或刪掉後，舊菜單裡找不到的菜換成新的一道
  const used=new Set(Object.values(M.plan).flat().map(r=>r.n).filter(n=>byName.has(n)));
  for(const rows of Object.values(M.plan))for(const r of rows)if(!byName.has(r.n)){const d=pick(r.slot,used,null);r.n=d.n;r.lock=false;used.add(d.n)}
  for(const d of Object.keys(M.plan).map(Number))if(!M.days.includes(d))delete M.plan[d];
  for(const d of M.days)if(!M.plan[d])addDay(d);
}

function shopData(){
  const have=haveSet(), need=new Map(), haveUsed=new Set(), staples=new Set();
  for(const rows of Object.values(M.plan||{}))for(const r of rows){
    const d=byName.get(r.n); if(!d)continue;
    for(const x of d.i){
      if(STAPLES.has(x)){staples.add(x==="蒜頭"?"蒜":x);continue}
      if(have.has(x)){haveUsed.add(x);continue}
      if(!need.has(x))need.set(x,[]);
      need.get(x).push(d.n);
    }
  }
  return {need,haveUsed,staples};
}
const money=n=>"NT$"+Math.round(n).toLocaleString("en-US");
function planDays(){return Object.keys(M.plan||{}).map(Number).sort((a,b)=>a-b)}
function renderSummary(){
  if(!M.plan||!planDays().length){$("#sumOut").innerHTML="";return}
  const days=planDays(), {need}=shopData();
  const cost=costOf(need),total=cost.pay;
  const top=[...need.keys()].sort((a,b)=>cost.packs.get(b)*priceOf(b)-cost.packs.get(a)*priceOf(a)).slice(0,3);
  // 均衡度
  const all=days.flatMap(d=>M.plan[d].map(r=>byName.get(r.n)).filter(Boolean));
  const prot={};all.forEach(d=>proteinsOf(d).forEach(p=>prot[p]=(prot[p]||0)+1));
  const maxP=Math.max(1,...Object.values(prot));
  const veg=new Set(all.flatMap(d=>d.i.filter(x=>groupOf(x)==="veg"&&!STAPLES.has(x))));
  const noVegDays=days.filter(day=>{const ds=M.plan[day].map(r=>byName.get(r.n)).filter(Boolean);
    return !ds.some(d=>d.c==="veg")&&ds.flatMap(d=>d.i.filter(x=>groupOf(x)==="veg"&&!STAPLES.has(x))).length<2});
  const mains=days.map(day=>byName.get((M.plan[day].find(r=>r.slot==="main"||r.slot==="pot")||{}).n)).filter(Boolean);
  const red=mains.filter(d=>proteinsOf(d).some(p=>p==="pork"||p==="beef")).length;
  const kinds=PROTEINS.filter(p=>prot[p.k]).length;
  const tips=[];
  tips.push(noVegDays.length?{ok:false,t:`${noVegDays.map(d=>WEEK[d]).join("、")}沒有青菜，${M.meal==="pot"?"可以換成蔬菜多一點的鍋":"可以把配菜換成一道青菜"}`}:{ok:true,t:"每天都有青菜"});
  const pot=M.meal==="pot";
  tips.push(veg.size>=days.length+(pot?1:3)?{ok:true,t:`這週吃到 ${veg.size} 種蔬菜`}:{ok:false,t:`這週只有 ${veg.size} 種蔬菜，${pot?"換成蔬菜多一點的鍋":"換一道不同的青菜"}會更豐富`});
  tips.push(kinds>=3?{ok:true,t:`蛋白質來源有 ${kinds} 種，很分散`}:{ok:false,t:`蛋白質來源只有 ${kinds} 種，可以換一道不同的肉或海鮮`});
  if(red>Math.ceil(days.length/2))tips.push({ok:false,t:`豬肉、牛肉當主菜 ${red} 次，可以換成雞肉或海鮮`});
  if(!prot.sea&&days.length>=3)tips.push({ok:false,t:"這週沒有海鮮，可以排一道魚或蝦"});
  // 熱量（一人份）
  const kcal=days.map(day=>{const ns=M.plan[day].map(r=>r.n);
    return ns.reduce((a,n)=>a+(KCAL[n]||200),0)+(ns.some(n=>HAS_CARB.has(n))?0:RICE_KCAL)});
  const avg=kcal.reduce((a,b)=>a+b,0)/kcal.length;
  $("#sumOut").innerHTML=`<div class="panel sum">
    <section><h3 class="sh">預估花費</h3><div class="big">${money(total)}</div>
      <p class="hint">這是買菜要付的錢。這週實際用掉約 <b>${money(cost.used)}</b>，平均每天 ${money(cost.used/days.length)}，買多的（例如半盒蛋）可以留到下週。</p>
      ${top.length?`<p class="hint">花最多的：${top.map(x=>`${x} ${money(cost.packs.get(x)*priceOf(x))}`).join("、")}</p>`:""}
      <p class="hint">價格是估的，可以在購物清單改成實際價格。</p></section>
    <section><h3 class="sh">均衡度</h3>
      <div class="pbars">${PROTEINS.map(p=>`<div class="pbar"><span>${p.name}</span><i><b style="width:${(prot[p.k]||0)/maxP*100}%"></b></i><em>${prot[p.k]||0}</em></div>`).join("")}</div>
      <ul class="tips">${tips.map(x=>`<li class="${x.ok?"ok":"warn"}">${x.t}</li>`).join("")}</ul></section>
    <section><h3 class="sh">熱量<span class="hint">（一人份）</span></h3>
      <ul class="kcal">${days.map((d,i)=>`<li><span>${WEEK[d]}</span><b>約 ${Math.round(kcal[i]/10)*10} kcal</b></li>`).join("")}</ul>
      <p class="hint">平均一餐約 ${Math.round(avg/10)*10} kcal。沒有麵飯的那餐已加一碗白飯（${RICE_KCAL} kcal），數字只是粗估。</p></section>
  </div>`;
}

  let t="【本週菜單】\n"+days.map(d=>`${WEEK[d]}：${M.plan[d].map(r=>r.n).join("、")}`).join("\n")+"\n\n【購物清單】\n";
  const cost=costOf(need);
  for(const g of GROUPS){const xs=[...need.keys()].filter(x=>groupOf(x)===g.k);if(xs.length)t+=`${g.name}：${xs.map(x=>cost.packs.get(x)>1?`${x}×${cost.packs.get(x)}`:x).join("、")}\n`}
  t+=`\n預估花費：約 ${money(cost.pay)}（實際用掉約 ${money(cost.used)}）`;
  return t.trim();
}

$("#menuView").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return;
  if(b.dataset.day!==undefined){
    const i=+b.dataset.day; M.days=M.days.includes(i)?M.days.filter(x=>x!==i):[...M.days,i].sort((a,b)=>a-b);
    syncDays();saveM();renderSettings();renderPlan();
  }else if(b.dataset.meal){
    if(M.meal!==b.dataset.meal){M.meal=b.dataset.meal;renderSettings();makePlan()}
  }
  else if(b.dataset.have){
    const x=b.dataset.have; M.have=M.have.includes(x)?M.have.filter(y=>y!==x):[...M.have,x];
    saveM();renderSettings();if(M.plan)renderPlan();
  }
  else if(b.id==="haveClear"){M.have=[];saveM();renderSettings();if(M.plan)renderPlan()}
  else if(b.id==="planBtn"){makePlan()}
  else if(b.dataset.pick){const [d,i]=b.dataset.pick.split(",").map(Number);pickFor(d,i)}
  else if(b.dataset.cooked!==undefined){toggleCooked(+b.dataset.cooked)}
  else if(b.dataset.addname){addToPlan(byName.get(b.dataset.addname))}
  else if(b.id==="shopModeBtn"){openShopMode()}
  else if(b.id==="shareBtn"){openShare()}
  else if(b.id==="useIncoming"){useIncoming()}
  else if(b.id==="dropIncoming"){incoming=null;$("#incoming").innerHTML="";try{history.replaceState(null,"","#menu")}catch(e){}}
  else if(b.dataset.swap){const [d,i]=b.dataset.swap.split(",").map(Number);swapDish(d,i)}
  else if(b.dataset.lock){const [d,i]=b.dataset.lock.split(",").map(Number);M.plan[d][i].lock=!M.plan[d][i].lock;saveM();renderPlan()}
  else if(b.dataset.open){open(byName.get(b.dataset.open))}
  else if(b.id==="copyBtn"){
    const t=planText();
    const fallback=()=>{$("#copyFallback").innerHTML=`<textarea class="copybox" id="copyBox" readonly aria-label="菜單和購物清單文字"></textarea>`;const box=$("#copyBox");box.value=t;box.select();$("#copyMsg").textContent="請長按或按 Ctrl+C 複製"};
    try{navigator.clipboard.writeText(t).then(()=>{$("#copyMsg").textContent="已複製，可以貼到 LINE 了"},fallback)}catch(err){fallback()}
  }
});
$("#menuView").addEventListener("change",e=>{
  const ds=e.target.dataset||{};
  if(ds.buy){
    const x=ds.buy;
    M.checked=e.target.checked?[...new Set([...M.checked,x])]:M.checked.filter(y=>y!==x);
    saveM();renderShop();$(`#buy-${CSS.escape(x)}`)?.focus();
  }else if(ds.price){
    // 清空就恢復成預估價
    const x=ds.price,v=e.target.value.trim(),n=Number(v);
    M.prices={...(M.prices||{})};
    if(v===""||!Number.isFinite(n)||n<0)delete M.prices[x];else M.prices[x]=Math.round(n);
    saveM();renderShop();
  }
});

function showView(v){
  const menu=v==="menu";
  $("#tabList").setAttribute("aria-selected",!menu);$("#tabMenu").setAttribute("aria-selected",menu);
  $("nav.bar").hidden=menu;$("#main").hidden=menu;$("#menuView").hidden=!menu;$("#shopFab").hidden=!menu;
  try{history.replaceState(null,"",menu?"#menu":location.pathname+location.search)}catch(e){}
}
$("#tabList").onclick=()=>showView("list");
$("#tabMenu").onclick=()=>showView("menu");
// ---------- 煮過的紀錄 ----------
let LOG=[];
try{LOG=JSON.parse(localStorage.getItem("kitchen-log-v1")||"[]")||[]}catch(e){LOG=[]}
const saveLog=()=>{try{localStorage.setItem("kitchen-log-v1",JSON.stringify(LOG))}catch(e){}};
const pad2=n=>String(n).padStart(2,"0");
const todayStr=()=>{const t=new Date();return `${t.getFullYear()}/${pad2(t.getMonth()+1)}/${pad2(t.getDate())}`};
function lastMade(d){
  const ds=d.p.map(dateOf).concat(LOG.filter(e=>e.n.includes(d.n)).map(e=>e.d)).filter(Boolean).sort();
  return ds.at(-1)||"";
}
const timesMade=d=>d.p.length+LOG.filter(e=>e.n.includes(d.n)).length;
function daysSince(s){if(!s)return 9999;const [y,m,dd]=s.split("/").map(Number);return Math.floor((Date.now()-new Date(y,m-1,dd))/864e5)}
function ago(s){const n=daysSince(s);if(n<31)return n+" 天前";if(n<365)return Math.floor(n/30)+" 個月前";return (n/365).toFixed(1).replace(".0","")+" 年前"}
function toggleCooked(day){
  M.cooked=M.cooked||{};
  const names=(M.plan[day]||[]).map(r=>r.n).filter(n=>byName.has(n));
  if(M.cooked[day]){
    const was=M.cooked[day];LOG=LOG.filter(e=>!(e.d===was&&e.day===day&&e.week===M.week));
    delete M.cooked[day];toast(`已取消${WEEK[day]}的紀錄`);
  }else{
    M.week=M.week||Date.now();
    const d=todayStr();M.cooked[day]=d;LOG.push({d,day,week:M.week,n:names});
    toast(`記下來了：${d} 煮了 ${names.join("、")}`);
  }
  saveLog();saveM();renderPlan();renderLongAgo();render($("#q").value);
}
function renderLongAgo(){
  const used=new Set(Object.values(M.plan||{}).flat().map(r=>r.n));
  const xs=DISHES.filter(d=>timesMade(d)>=2&&!used.has(d.n)).map(d=>({d,last:lastMade(d)}))
    .filter(x=>daysSince(x.last)>90).sort((a,b)=>a.last.localeCompare(b.last)).slice(0,6);
  $("#longAgoBox").hidden=!xs.length;
  $("#longAgo").innerHTML=xs.map(x=>`<button data-addname="${x.d.n}">+ ${x.d.n}<small>${ago(x.last)}</small></button>`).join("");
}

// ---------- 對話框與提示 ----------
let dlgReturn=null;
function openDlg(title,html){dlgReturn=document.activeElement;$("#dlgTitle").textContent=title;$("#dlgBody").innerHTML=html;$("#dlg").hidden=false;$("#dlgClose").focus()}
function closeDlg(){$("#dlg").hidden=true;$("#dlgBody").innerHTML="";dlgReturn&&dlgReturn.focus&&dlgReturn.focus()}
$("#dlgClose").onclick=closeDlg;
$("#dlg").addEventListener("click",e=>{if(e.target.id==="dlg")closeDlg()});
let toastT=null;
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,3200)}
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if(!$("#dlg").hidden)closeDlg();else if(!$("#shopMode").hidden)closeShopMode()});

// ---------- 自己挑菜 ----------
const fitsSlot=(d,slot)=>SLOT[slot].ok?SLOT[slot].ok(d):SLOT[slot].cats.includes(d.c);
function slotFor(d){
  if(M.meal==="pot"&&fitsSlot(d,"pot"))return "pot";
  return {meat:"main",sea:"main",main:"main",egg:"side",veg:"veg",soup:"soup"}[d.c]||"side";
}
function addToPlan(d){
  if(!d)return;
  if(!M.plan||!planDays().length){toast("先到「本週菜單」選要煮哪幾天");return}
  openDlg(`把「${d.n}」加到哪一天？`,`<div class="daypick">`+planDays().map(day=>
    `<button data-day-add="${day}"><b>${WEEK[day]}</b><small>${M.plan[day].map(r=>r.n).join("、")}</small></button>`).join("")+`</div>`);
  $("#dlgBody").onclick=e=>{
    const b=e.target.closest("[data-day-add]");if(!b)return;
    const day=+b.dataset.dayAdd,rows=M.plan[day];
    let i=rows.findIndex(r=>!r.lock&&fitsSlot(d,r.slot));
    if(i<0)i=rows.findIndex(r=>fitsSlot(d,r.slot)&&!(M.cooked&&M.cooked[day]));
    let msg;
    if(i>=0){msg=`已加到${WEEK[day]}，換掉了${rows[i].n}`;rows[i]={slot:rows[i].slot,n:d.n,lock:true}}
    else{rows.push({slot:slotFor(d),n:d.n,lock:true});msg=`已加到${WEEK[day]}（多一道菜）`}
    saveM();renderPlan();renderLongAgo();closeDlg();toast(msg);
  };
}
function pickFor(day,i){
  const row=M.plan[day][i];
  const list=DISHES.filter(d=>fitsSlot(d,row.slot)).sort((a,b)=>timesMade(b)-timesMade(a));
  openDlg(`${WEEK[day]}的${SLOT[row.slot].name}要煮什麼？`,
    `<input class="picksearch" id="pickQ" type="search" placeholder="搜尋菜名或食材" aria-label="搜尋菜名或食材"><div class="picklist" id="pickList"></div>`);
  const draw=q=>{$("#pickList").innerHTML=list.filter(d=>!q||d.n.includes(q)||d.i.some(x=>x.includes(q))).map(d=>
    `<button data-pick-n="${d.n}"><img src="${cover(d)}" alt="" loading="lazy"><span>${d.n}</span><small>最近 ${lastMade(d)} · 約 ${KCAL[d.n]||200} kcal</small></button>`).join("")||`<p class="hint">找不到符合的菜</p>`};
  draw("");
  $("#pickQ").addEventListener("input",e=>draw(e.target.value.trim()));
  $("#dlgBody").onclick=e=>{
    const b=e.target.closest("[data-pick-n]");if(!b)return;
    M.plan[day][i]={slot:row.slot,n:b.dataset.pickN,lock:true};
    saveM();renderPlan();renderLongAgo();closeDlg();toast(`${WEEK[day]}改成${b.dataset.pickN}，已鎖住`);
  };
}

// ---------- 傳到手機 ----------
const SHARE_BASE="https://kang0921.github.io/sophia-kitchen/";
const SLOT_CODE={main:"m",side:"s",veg:"v",soup:"u",pot:"p"},CODE_SLOT=Object.fromEntries(Object.entries(SLOT_CODE).map(([a,b])=>[b,a]));
const idxOf=new Map(DISHES.map((d,i)=>[d.n,i]));
function encodePlan(){
  const o={m:M.meal,d:planDays().map(day=>[day,M.plan[day].map(r=>[SLOT_CODE[r.slot],idxOf.get(r.n),r.lock?1:0])]),h:M.have,c:M.checked,pr:M.prices};
  const bytes=new TextEncoder().encode(JSON.stringify(o));let bin="";bytes.forEach(b=>bin+=String.fromCharCode(b));
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function decodePlan(str){
  try{
    const bin=atob(str.replace(/-/g,"+").replace(/_/g,"/"));const o=JSON.parse(new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0))));
    if(!o||!Array.isArray(o.d)||!mealOf(o.m))return null;
    const plan={};
    for(const [day,rows] of o.d){
      if(!(day>=0&&day<7))return null;
      plan[day]=rows.map(([c,i,l])=>({slot:CODE_SLOT[c],n:DISHES[i]&&DISHES[i].n,lock:!!l})).filter(r=>r.slot&&r.n);
    }
    return {meal:o.m,plan,days:Object.keys(plan).map(Number).sort((a,b)=>a-b),have:Array.isArray(o.h)?o.h:[],checked:Array.isArray(o.c)?o.c:[],prices:o.pr&&typeof o.pr==="object"?o.pr:{}};
  }catch(e){return null}
}
function openShare(){
  const url=SHARE_BASE+"#p="+encodePlan();
  openDlg("傳到手機",`<p class="hint" style="margin:0">用手機相機掃描，或把連結傳給自己。打開後會問你要不要使用這份菜單和購物清單。</p>
    <div class="qr" id="qrBox"></div>
    <input class="sharelink" id="shareLink" readonly aria-label="分享連結">
    <div class="actions"><button class="btn primary" id="copyLink" style="font-size:16px;padding:8px 20px">複製連結</button><span class="copymsg" id="linkMsg" role="status"></span></div>`);
  $("#shareLink").value=url;
  try{new QRCode($("#qrBox"),{text:url,width:200,height:200,correctLevel:QRCode.CorrectLevel.L})}
  catch(e){$("#qrBox").outerHTML=`<p class="hint">QR code 無法顯示，請改用下面的連結。</p>`}
  $("#copyLink").onclick=()=>{
    const done=()=>$("#linkMsg").textContent="已複製";
    const fb=()=>{$("#shareLink").select();$("#linkMsg").textContent="已選取，請長按或按 Ctrl+C 複製"};
    try{navigator.clipboard.writeText(url).then(done,fb)}catch(e){fb()}
  };
}
let incoming=null;
function showIncoming(){
  if(!incoming)return;
  const n=Object.values(incoming.plan).flat().length;
  $("#incoming").innerHTML=`<div class="incoming"><p>收到一份分享的菜單：${incoming.days.map(d=>WEEK[d].slice(2)).join("、")}，共 ${n} 道菜。要用這份取代目前的菜單和購物清單嗎？</p>
    <button class="btn primary" id="useIncoming" style="font-size:16px;padding:8px 20px">使用這份</button><button class="btn" id="dropIncoming">不要</button></div>`;
}
function useIncoming(){
  Object.assign(M,{meal:incoming.meal,days:incoming.days,plan:incoming.plan,have:incoming.have,checked:incoming.checked,prices:{...M.prices,...incoming.prices},cooked:{}});
  incoming=null;$("#incoming").innerHTML="";saveM();renderSettings();renderPlan();renderLongAgo();
  try{history.replaceState(null,"","#menu")}catch(e){}
  toast("已換成分享的菜單");
}

// ---------- 購物模式 ----------
let wakeLock=null;
function openShopMode(){
  if(!M.plan){toast("先排好菜單");return}
  drawShopMode();$("#shopMode").hidden=false;document.body.style.overflow="hidden";$("#smClose").focus();
  try{navigator.wakeLock&&navigator.wakeLock.request("screen").then(l=>wakeLock=l).catch(()=>{})}catch(e){}
}
function closeShopMode(){$("#shopMode").hidden=true;document.body.style.overflow="";try{wakeLock&&wakeLock.release()}catch(e){}wakeLock=null;renderShop()}
function drawShopMode(){
  const {need,haveUsed,staples}=shopData(),cost=costOf(need),checked=new Set(M.checked);
  const done=[...need.keys()].filter(x=>checked.has(x)).length;
  $("#shopMode").innerHTML=`<div class="sm-head"><div><h2>購物清單</h2><p id="smCount">已買 ${done} / ${need.size} 樣 · 約 ${money(cost.pay)}</p></div>
    <button class="btn" id="smClose">關閉</button></div><div class="sm-body">`+
    GROUPS.map(g=>{const xs=[...need].filter(([x])=>groupOf(x)===g.k);
      return xs.length?`<h4>${g.name}</h4>`+xs.map(([x,ds])=>`<label class="sm-item${checked.has(x)?" done":""}"><input type="checkbox" data-smbuy="${x}"${checked.has(x)?" checked":""}><span>${x}${cost.packs.get(x)>1?` <b class="qty">×${cost.packs.get(x)}</b>`:""}</span><small>${ds.length>1?ds.length+" 道菜":ds[0]}</small></label>`).join(""):""}).join("")+
    (haveUsed.size?`<h4>冰箱已有，不用買</h4><div class="chiplist">${[...haveUsed].map(x=>`<span>${x}</span>`).join("")}</div>`:"")+
    (staples.size?`<h4>確認家裡還有</h4><div class="chiplist">${[...staples].map(x=>`<span>${x}</span>`).join("")}</div>`:"")+`</div>`;
  $("#smClose").onclick=closeShopMode;
}
$("#shopMode").addEventListener("change",e=>{
  const x=e.target.dataset&&e.target.dataset.smbuy;if(!x)return;
  M.checked=e.target.checked?[...new Set([...M.checked,x])]:M.checked.filter(y=>y!==x);saveM();
  e.target.closest(".sm-item").classList.toggle("done",e.target.checked);
  const {need}=shopData(),c=new Set(M.checked);
  $("#smCount").textContent=`已買 ${[...need.keys()].filter(y=>c.has(y)).length} / ${need.size} 樣 · 約 ${money(costOf(need).pay)}`;
});
$("#shopFab").onclick=openShopMode;

stats();render();
renderSettings();
if(!M.plan)makePlan();else{syncDays();saveM();renderPlan()}
// 「已煮好」只保留一週，下週重新排時就不會卡住
if(M.cooked){for(const [d,t] of Object.entries(M.cooked))if(daysSince(t)>=7)delete M.cooked[d];saveM();renderPlan()}
renderLongAgo();
if(location.hash.startsWith("#p=")){incoming=decodePlan(location.hash.slice(3));showView("menu");if(incoming)showIncoming();else toast("這個分享連結看不懂，可能被截斷了")}
else if(location.hash==="#menu")showView("menu");
</script>
